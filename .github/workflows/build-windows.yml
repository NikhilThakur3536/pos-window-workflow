
name: Build OneTouch POS Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      # 4. Configure pnpm cache
      - name: Enable pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 5. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6. Clean previous builds
      - name: Clean previous builds
        run: pnpm run clean

      # 7. Rebuild Electron native modules for Windows
      - name: Rebuild Electron native modules
        run: pnpm run rebuild

      # 8. Build Next.js
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: production
        run: pnpm exec next build

      # 9. Build Windows installer
      - name: Build Windows installer
        run: pnpm exec electron-builder --win nsis

      # 10. Upload Windows EXE
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OneTouch-POS-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
