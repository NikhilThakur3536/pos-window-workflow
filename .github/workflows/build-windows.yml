
name: Build OneTouch POS Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Clean previous builds
      - name: Clean previous builds
        run: npm run clean --if-present

      # 5. Rebuild Electron native modules for Windows
      - name: Rebuild Electron native modules
        run: npm run rebuild

      # 6. Build Next.js
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: production
        run: npx next build

      # 7. Build Windows installer
      - name: Build Windows installer
        run: npx electron-builder --win nsis

      # 8. Upload Windows EXE
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OneTouch-POS-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
